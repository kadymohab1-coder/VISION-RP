name: Extract VISION RP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          test -n "$ZIP"
          mkdir -p /tmp/vision
          unzip -q "$ZIP" -d /tmp/vision
          cp -a /tmp/vision/openrp-main/. .
          rm "$ZIP"

      - name: Save files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract VISION RP project"
          git push
